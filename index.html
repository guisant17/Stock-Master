<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Master</title>
<style>
:root{--blue:#1707f7;--green:#16a34a;--orange:#f97316;--red:#dc2626;--ink:#1f2937;--line:#d8dee6}
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:var(--ink);font:16px Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:26px max(22px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;margin:0}header small,.hint{color:#67717e}.wrap{max-width:1080px;margin:30px auto;padding:0 20px}.tag{color:#14532d;background:#dcfce7;border:1px solid #86efac;border-radius:20px;padding:7px 12px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin:20px 0;box-shadow:0 1px 3px #0000000d}h2{font-size:19px;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(115px,1fr)) auto;gap:12px;align-items:end}
label{display:grid;gap:6px;font-size:13px;font-weight:bold}input,select{width:100%;border:1px solid #bac3ce;border-radius:5px;padding:10px;background:#fff;font:inherit}button{border:0;border-radius:5px;padding:11px 15px;color:#fff;background:var(--blue);font-weight:bold;cursor:pointer}button.green{background:var(--green)}button.red{background:var(--red);padding:7px 9px;font-size:12px}.hint{font-size:13px;margin:12px 0 0}
table{width:100%;border-collapse:collapse;background:#fff}th{background:var(--blue);color:#fff;text-align:left;padding:13px}td{padding:13px;border-bottom:1px solid var(--line)}tr.good{background:#bbf7d0;color:#14532d;font-weight:600}tr.alert{background:#fed7aa;color:#9a3412;font-weight:700}tr.expired{background:#fecaca;color:#991b1b;font-weight:700}tr.good td:first-child,tr.alert td:first-child,tr.expired td:first-child{border-left:7px solid currentColor}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}table{font-size:13px}th,td{padding:9px}}
</style></head>
<body>
<header><div><h1>📦 Stock Master</h1><small>Gestão de produtos e controle de estoque</small></div><span class="tag">Dados salvos neste navegador</span></header>
<main class="wrap">
<section class="card"><h2>Movimentação de estoque</h2><form id="movement" class="grid"><label>ID do produto<input id="moveId" type="number" required placeholder="Ex.: 101"></label><label>Ação<select id="moveAction"><option value="in">Entrada</option><option value="out">Saída (baixa)</option></select></label><label>Quantidade<input id="moveQuantity" type="number" min="1" required placeholder="0"></label><label>Peso (kg)<input id="moveWeight" type="number" min="0" step="0.01" required placeholder="0,00"></label><button>Registrar movimentação</button></form></section>
<section class="card"><h2>Cadastrar novo produto</h2><form id="product" class="grid"><label>ID<input id="id" type="number" required placeholder="Ex.: 103"></label><label>Descrição<input id="description" required placeholder="Nome do produto"></label><label>Quantidade<input id="quantity" type="number" min="0" required placeholder="0"></label><label>Peso (kg)<input id="weight" type="number" min="0" step="0.01" required placeholder="0,00"></label><label>Validade<input id="expiration" type="date" required></label><button class="green">Salvar produto</button></form><p class="hint">Os dados ficam salvos somente neste navegador.</p></section>
<section class="card"><h2>Produtos em estoque</h2><table><thead><tr><th>ID</th><th>Descrição</th><th>Quantidade</th><th>Peso (kg)</th><th>Validade</th><th>Ações</th></tr></thead><tbody id="products"></tbody></table></section>
</main>
<script>
const key='stock-master-products-v1';
const initial=[{id:101,description:'Arroz 5 kg',quantity:40,weight:200,expiration:'2027-05-18'},{id:102,description:'Leite integral',quantity:18,weight:18,expiration:'2026-11-25'},{id:103,description:'Molho de tomate',quantity:8,weight:2.72,expiration:'2026-10-30'}];
const read=()=>JSON.parse(localStorage.getItem(key)||JSON.stringify(initial));
const save=items=>localStorage.setItem(key,JSON.stringify(items));
function state(date){const days=Math.ceil((new Date(date+'T00:00:00')-new Date(new Date().toDateString()))/86400000);return days<=0?'expired':days<=30?'alert':'good'}
function render(){const items=read();document.getElementById('products').innerHTML=items.map(p=>'<tr class="'+state(p.expiration)+'"><td>'+p.id+'</td><td>'+p.description+'</td><td>'+p.quantity+'</td><td>'+Number(p.weight).toFixed(2)+'</td><td>'+p.expiration+'</td><td><button class="red" onclick="removeProduct('+p.id+')">Excluir</button></td></tr>').join('')}
function removeProduct(id){if(confirm('Excluir este produto?')){save(read().filter(p=>p.id!==id));render()}}
document.getElementById('product').addEventListener('submit',e=>{e.preventDefault();const items=read(),id=Number(document.getElementById('id').value);if(items.some(p=>p.id===id)){alert('Esse ID já existe.');return}items.push({id,description:document.getElementById('description').value.trim(),quantity:Number(document.getElementById('quantity').value),weight:Number(document.getElementById('weight').value),expiration:document.getElementById('expiration').value});save(items);e.target.reset();render()});
document.getElementById('movement').addEventListener('submit',e=>{e.preventDefault();const items=read(),id=Number(document.getElementById('moveId').value),p=items.find(x=>x.id===id),q=Number(document.getElementById('moveQuantity').value),w=Number(document.getElementById('moveWeight').value),action=document.getElementById('moveAction').value;if(!p){alert('Produto não encontrado.');return}if(action==='out'&&(p.quantity<q||p.weight<w)){alert('Estoque insuficiente.');return}p.quantity+=action==='in'?q:-q;p.weight+=action==='in'?w:-w;save(items);e.target.reset();render()});
render();
</script></body></html>
